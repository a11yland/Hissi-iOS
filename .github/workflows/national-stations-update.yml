name: National stations update

# Weekly regeneration of the national station list (the DB stations across
# Germany with their FaSta elevator numbers, from the Aufzugsstatus API —
# scripts/generate-national-stations.py), diffed against the bundled one. On
# drift, opens (or updates) a PR from branch `national-stations-update` that
# replaces the bundled list, the drift report as its description. Hissi-Android
# copies the merged list over with its Seed sync workflow. The crawl is paced
# to the API's fair-use limit and takes ~25 minutes; no credentials needed.

on:
  schedule:
    - cron: "0 5 * * 3" # Wednesdays 05:00 UTC (the seed runs Mondays)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate-national-stations.py"
      - ".github/workflows/national-stations-update.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write # the seed-update label

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Generate fresh list
        run: python3 scripts/generate-national-stations.py /tmp/fresh-national.json

      - name: Upload fresh list
        uses: actions/upload-artifact@v7
        with:
          name: fresh-national-stations
          path: /tmp/fresh-national.json
          retention-days: 7

      - name: Diff against bundled list
        id: diff
        run: |
          set +e
          python3 scripts/generate-national-stations.py --diff Shared/Resources/national-stations.json /tmp/fresh-national.json > /tmp/drift.md
          rc=$?
          set -e
          cat /tmp/drift.md
          # 0 = no drift, 1 = drift; anything else is a script failure.
          [ "$rc" -le 1 ] || exit "$rc"
          echo "drifted=$rc" >> "$GITHUB_OUTPUT"

      # Same mechanics as the Seed update workflow: one signed commit on top of
      # main through the Git data API, branch rebuilt per drifted run.
      - name: Open or update PR
        if: steps.diff.outputs.drifted == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          file=Shared/Resources/national-stations.json
          branch=national-stations-update

          base=$(gh api "$api/git/ref/heads/main" --jq .object.sha)
          base_tree=$(gh api "$api/git/commits/$base" --jq .tree.sha)
          blob=$(jq -n --arg content "$(base64 -w0 /tmp/fresh-national.json)" \
            '{content: $content, encoding: "base64"}' \
            | gh api "$api/git/blobs" --input - --jq .sha)
          tree=$(jq -n --arg base "$base_tree" --arg path "$file" --arg sha "$blob" \
            '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}]}' \
            | gh api "$api/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg tree "$tree" --arg parent "$base" \
            '{message: "chore(seed): regenerate national station list", tree: $tree, parents: [$parent]}' \
            | gh api "$api/git/commits" --input - --jq .sha)

          if gh api "$api/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "$api/git/refs/heads/$branch" -f sha="$commit" -F force=true >/dev/null
          else
            gh api "$api/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" >/dev/null
          fi

          {
            cat /tmp/drift.md
            echo
            echo "---"
            echo "Generated by the National stations update workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo "After merging, Hissi-Android's Seed sync workflow opens the matching copy PR there."
          } > /tmp/pr.md

          gh label create seed-update --repo "$GITHUB_REPOSITORY" \
            --description "Bundled seed catalog diverges from a fresh generation" \
            --color D93F0B 2>/dev/null || true
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore(seed): regenerate national station list" \
              --label seed-update \
              --body-file /tmp/pr.md
          fi
