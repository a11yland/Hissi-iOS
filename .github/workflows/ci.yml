name: CI

# Unit tests on pushes to main and on pull requests that touch the app: the
# Swift package in HissiTests (parsers, catalog, rules). The app itself is
# built and archived by Xcode Cloud. Pull requests cover the feature branches, so the
# push trigger is limited to main — otherwise every PR push ran twice.
on:
  push:
    branches: [main]
    paths:
      - "Shared/**"
      - "Hissi/**"
      - "HissiWidget/**"
      - "HissiWatch/**"
      - "HissiWatchWidget/**"
      - "HissiTests/**"
      - "Hissi.xcodeproj/**"
      - "Secrets.example.swift"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Shared/**"
      - "Hissi/**"
      - "HissiWidget/**"
      - "HissiWatch/**"
      - "HissiWatchWidget/**"
      - "HissiTests/**"
      - "Hissi.xcodeproj/**"
      - "Secrets.example.swift"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Provide Secrets stub
        run: cp Secrets.example.swift Shared/Secrets.swift
      - name: Swift version
        run: swift --version
      - name: Run parser tests
        working-directory: HissiTests
        run: swift test
