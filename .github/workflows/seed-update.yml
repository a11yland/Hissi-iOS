name: Seed update

# Weekly regeneration of the seed catalog, diffed against the bundled one.
# On drift, opens (or updates) a PR from branch `seed-update` that replaces
# the bundled seed with the fresh one, the drift report as its description,
# so index shifts and coverage changes reach the app by merging. Hissi-Android
# copies the merged seed over with its Seed sync workflow.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write # the seed-update label

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate fresh seed
        env:
          ACCESSIBILITY_CLOUD_APP_TOKEN: ${{ secrets.ACCESSIBILITY_CLOUD_APP_TOKEN }}
          ACCESSIBILITY_CLOUD_LEGACY_TOKEN: ${{ secrets.ACCESSIBILITY_CLOUD_LEGACY_TOKEN }}
        run: python3 scripts/generate-seed-catalog.py /tmp/fresh-seed.json

      # The fresh seed is uploaded so a release regen can download it instead
      # of needing the legacy token locally.
      - name: Upload fresh seed
        uses: actions/upload-artifact@v7
        with:
          name: fresh-seed
          path: /tmp/fresh-seed.json
          retention-days: 7

      - name: Diff against bundled seed
        id: diff
        run: |
          set +e
          python3 scripts/diff-seed-catalog.py Shared/Resources/seed-catalog.json /tmp/fresh-seed.json > /tmp/drift.md
          rc=$?
          set -e
          cat /tmp/drift.md
          # 0 = no drift, 1 = drift; anything else is a script failure.
          [ "$rc" -le 1 ] || exit "$rc"
          echo "drifted=$rc" >> "$GITHUB_OUTPUT"

      # The fresh seed goes straight into a PR (branch `seed-update`, one
      # commit on top of main) instead of an issue: reviewing the drift report
      # and merging is the whole update. The commit is made through the Git
      # data API, so GitHub signs it and main's signature rule accepts the
      # merge. Each drifted run rebuilds the branch on the current main, so the
      # PR always carries the latest generation. Needs "Allow GitHub Actions to
      # create and approve pull requests" (Settings → Actions → General). A PR
      # opened with the workflow token starts no other workflows — CI runs
      # again after the merge.
      - name: Open or update seed PR
        if: steps.diff.outputs.drifted == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          file=Shared/Resources/seed-catalog.json
          branch=seed-update

          base=$(gh api "$api/git/ref/heads/main" --jq .object.sha)
          base_tree=$(gh api "$api/git/commits/$base" --jq .tree.sha)
          blob=$(jq -n --arg content "$(base64 -w0 /tmp/fresh-seed.json)" \
            '{content: $content, encoding: "base64"}' \
            | gh api "$api/git/blobs" --input - --jq .sha)
          tree=$(jq -n --arg base "$base_tree" --arg path "$file" --arg sha "$blob" \
            '{base_tree: $base, tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}]}' \
            | gh api "$api/git/trees" --input - --jq .sha)
          # No author/committer: GitHub then signs the commit as github-actions[bot].
          commit=$(jq -n --arg tree "$tree" --arg parent "$base" \
            '{message: "chore(seed): regenerate seed catalog", tree: $tree, parents: [$parent]}' \
            | gh api "$api/git/commits" --input - --jq .sha)

          if gh api "$api/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "$api/git/refs/heads/$branch" -f sha="$commit" -F force=true >/dev/null
          else
            gh api "$api/git/refs" -f ref="refs/heads/$branch" -f sha="$commit" >/dev/null
          fi

          {
            cat /tmp/drift.md
            echo
            echo "---"
            echo "Generated by the Seed update workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo "After merging, Hissi-Android's Seed sync workflow opens the matching copy PR there."
          } > /tmp/pr.md

          gh label create seed-update --repo "$GITHUB_REPOSITORY" \
            --description "Bundled seed catalog diverges from a fresh generation" \
            --color D93F0B 2>/dev/null || true
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "chore(seed): regenerate seed catalog" \
              --label seed-update \
              --body-file /tmp/pr.md
          fi
